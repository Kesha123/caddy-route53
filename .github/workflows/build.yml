name: build

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        type: string
        default: latest

permissions:
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make build \
            NAMESPACE="$owner" \
            BUILD_TAG=${{ inputs.tag }}-${{ matrix.arch }} \
            PLATFORM=linux/${{ matrix.arch }}

      - name: Publish
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish \
            NAMESPACE="$owner" \
            BUILD_TAG=${{ inputs.tag }}-${{ matrix.arch }}
