name: build

on:
  workflow_call:
    inputs:
      suffix:
        description: Tag suffix (e.g. pr)
        type: string
        default: ''
        required: false
  workflow_dispatch:
    inputs:
      suffix:
        description: Tag suffix (e.g. pr)
        type: string
        default: ''
        required: false

permissions:
  packages: write
  security-events: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine tags
        id: tag
        run: |
          version="$(scripts/caddy-version 2>/dev/null || echo latest)"
          if [ -n "${{ inputs.suffix }}" ]; then tag="${version}-${{ inputs.suffix }}"; else tag="$version"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx builder
        run: docker buildx create --name ci --driver docker-container --bootstrap --use

      - name: Build
        run: |
          make build \
            NAMESPACE=${{ steps.tag.outputs.owner }} \
            BUILD_TAG=${{ steps.tag.outputs.tag }}-${{ matrix.arch }} \
            CREATED=${{ steps.tag.outputs.created }} \
            REVISION=${{ github.sha }} \
            PLATFORM=linux/${{ matrix.arch }}

      - name: Scan image (report only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.tag.outputs.owner }}/caddy-route53:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Publish
        run: |
          make publish \
            NAMESPACE=${{ steps.tag.outputs.owner }} \
            BUILD_TAG=${{ steps.tag.outputs.tag }}-${{ matrix.arch }} \
            CREATED=${{ steps.tag.outputs.created }} \
            REVISION=${{ github.sha }} \
            PLATFORM=linux/${{ matrix.arch }}
