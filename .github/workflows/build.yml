name: build

on:
  workflow_call:
    inputs:
      suffix:
        description: Tag suffix (e.g. pr)
        type: string
        default: ''
        required: false
  workflow_dispatch:
    inputs:
      suffix:
        description: Tag suffix (e.g. pr)
        type: string
        default: ''
        required: false

permissions:
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          version="$(scripts/caddy-version 2>/dev/null || echo latest)"
          if [ -n "${{ inputs.suffix }}" ]; then tag="${version}-${{ inputs.suffix }}"; else tag="$version"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make build \
            NAMESPACE="$owner" \
            BUILD_TAG=${{ steps.tag.outputs.tag }}-${{ matrix.arch }} \
            PLATFORM=linux/${{ matrix.arch }}

      - name: Publish
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish \
            NAMESPACE="$owner" \
            BUILD_TAG=${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
