name: publish

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        type: string
        default: latest

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish-assemble \
            NAMESPACE="$owner" \
            BUILD_TAG=${{ inputs.tag }}
