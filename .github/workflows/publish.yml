name: publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: echo "tag=$(scripts/caddy-version 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"

      - name: Assemble multi-arch manifest
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          make publish-assemble \
            NAMESPACE="$owner" \
            BUILD_TAG=${{ steps.tag.outputs.tag }}
